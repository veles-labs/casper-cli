[package]
name = "casper-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
argon2 = "0.5"
bip32 = "0.5"
blake2 = "0.10"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7"
dirs = "5"
hex = "0.4"
rand_core = { version = "0.6", features = ["std"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
zeroize = "1"
veles-casper-rust-sdk = "0.1.0"
casper-types = "6.1.0"

[dev-dependencies]
tempfile = "3"
