[package]
name = "casper-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "CLI wallet manager for Casper: create/recover wallets, derive accounts, and deploy smart contracts."
documentation = "https://docs.rs/casper-cli"
homepage = "http://veleslabs.xyz"
repository = "https://github.com/veles-labs/casper-cli"
readme = "../../README.md"

[dependencies]
anyhow = "1"
anstyle = "1"
argon2 = "0.5"
bip32 = "0.5"
blake2 = "0.10"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7"
dirs = "5"
hex = "0.4"
rand_core = { version = "0.6", features = ["std"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
zeroize = "1"
veles-casper-rust-sdk = "0.3.0"
casper-types = "6.1.0"
casper-execution-engine = { version = "8.1.1" }
casper-storage = { version = "2.1.1" }
sled = "0.34.7"
casper-binary-port = "1.1.1"
veles-casper-contract-api = { version = "0.1.0", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
